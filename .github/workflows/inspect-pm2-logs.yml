name: Inspect PM2 Logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PM2 logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "=== PM2 list ==="
            pm2 list || true

            echo "=== PM2 logs (last 60 lines) ==="
            pm2 logs satmi-ads --lines 60 --nostream || true

            echo "=== Nginx error log (last 40 lines) ==="
            sudo tail -n 40 /var/log/nginx/error.log 2>/dev/null || tail -n 40 /var/log/nginx/error.log 2>/dev/null || true
