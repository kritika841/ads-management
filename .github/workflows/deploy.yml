name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Package build output
        run: |
          tar -czf release.tar.gz \
            .next \
            ops \
            public \
            scripts \
            lib \
            package.json \
            package-lock.json \
            deploy.sh \
            ecosystem.config.cjs \
            next.config.ts

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "release.tar.gz"
          target: "/home/deployer/apps/satmi-ads"

      - name: Extract and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: META_TOKEN,META_ACCOUNT
          script: |
            set -e
            APP_DIR="/home/deployer/apps/satmi-ads"
            ENV_FILE="$APP_DIR/.env"
            touch "$ENV_FILE"

            # Sync Meta credentials into production .env if available
            node -e '
            const fs = require("fs");
            const envPath = "'"$ENV_FILE"'";
            let content = fs.existsSync(envPath) ? fs.readFileSync(envPath, "utf8") : "";
            const updates = {
              META_ACCESS_TOKEN: process.env.META_TOKEN || "",
              META_AD_ACCOUNT_ID: process.env.META_ACCOUNT || ""
            };
            for (const [key, val] of Object.entries(updates)) {
              if (!val) continue;
              const regex = new RegExp(`^${key}=.*$`, "m");
              if (regex.test(content)) {
                content = content.replace(regex, `${key}=${val}`);
              } else {
                content = (content.endsWith("\n") || content.length === 0 ? content : content + "\n") + `${key}=${val}\n`;
              }
            }
            fs.writeFileSync(envPath, content, "utf8");
            '

            bash /home/deployer/apps/satmi-ads/deploy.sh

