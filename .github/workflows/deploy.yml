name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ads.satmi.in"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4MzU4NTI5MSwiZXhwIjoyMDk5MTYxMjkxfQ.PNmYQFpq0Yu7QwCq08JAivVQ9WCS3rWzT09CwPs8xZg"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzgzNTg1MjkxLCJleHAiOjIwOTkxNjEyOTF9.kcaaZgkR7f_65dSnvynjZ22cqdU451Q934r0JwvnU-8"

      - name: Package build output
        run: |
          tar -czf release.tar.gz \
            .next \
            ops \
            public \
            scripts \
            lib \
            package.json \
            package-lock.json \
            deploy.sh \
            ecosystem.config.cjs \
            next.config.ts

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "release.tar.gz"
          target: "/home/deployer/apps/satmi-ads"

      - name: Extract and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_BASE64 }}
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: PROD_ENV_B64,META_TOKEN,META_ACCOUNT
          script: |
            set -e
            APP_DIR="/home/deployer/apps/satmi-ads"
            ENV_FILE="$APP_DIR/.env"
            
            if [ -n "$PROD_ENV_B64" ]; then
              echo "$PROD_ENV_B64" | base64 -d > "$ENV_FILE"
              echo "Synced complete production .env from secret."
            else
              touch "$ENV_FILE"
            fi

            # Double check Meta and VPS Supabase credentials are in place
            node -e '
            const fs = require("fs");
            const envPath = "'"$ENV_FILE"'";
            let content = fs.existsSync(envPath) ? fs.readFileSync(envPath, "utf8") : "";
            const updates = {
              NEXT_PUBLIC_SUPABASE_URL: "https://ads.satmi.in",
              NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4MzU4NTI5MSwiZXhwIjoyMDk5MTYxMjkxfQ.PNmYQFpq0Yu7QwCq08JAivVQ9WCS3rWzT09CwPs8xZg",
              SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzgzNTg1MjkxLCJleHAiOjIwOTkxNjEyOTF9.kcaaZgkR7f_65dSnvynjZ22cqdU451Q934r0JwvnU-8",
              META_ACCESS_TOKEN: process.env.META_TOKEN || "",
              META_AD_ACCOUNT_ID: process.env.META_ACCOUNT || ""
            };
            for (const [key, val] of Object.entries(updates)) {
              if (!val) continue;
              const regex = new RegExp(`^${key}=.*$`, "m");
              if (regex.test(content)) {
                content = content.replace(regex, `${key}=${val}`);
              } else {
                content = (content.endsWith("\n") || content.length === 0 ? content : content + "\n") + `${key}=${val}\n`;
              }
            }
            fs.writeFileSync(envPath, content, "utf8");
            '

            bash /home/deployer/apps/satmi-ads/deploy.sh

