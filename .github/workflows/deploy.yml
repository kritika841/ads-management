name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ads.satmi.in"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4MzU4NTI5MSwiZXhwIjoyMDk5MTYxMjkxfQ.PNmYQFpq0Yu7QwCq08JAivVQ9WCS3rWzT09CwPs8xZg"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzgzNTg1MjkxLCJleHAiOjIwOTkxNjEyOTF9.kcaaZgkR7f_65dSnvynjZ22cqdU451Q934r0JwvnU-8"

      - name: Package build output
        run: |
          tar --exclude='.next/cache' -czf release.tar.gz \
            .next \
            ops \
            public \
            scripts \
            lib \
            supabase \
            package.json \
            package-lock.json \
            deploy.sh \
            ecosystem.config.cjs \
            next.config.ts

      - name: Publish build artifact to GitHub release
        id: release_artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete deploy-artifact --yes --cleanup-tag 2>/dev/null || true
          gh release create deploy-artifact release.tar.gz --title "Deploy Artifact" --notes "Automated deploy bundle" --prerelease
          ASSET_URL=$(gh release view deploy-artifact --json assets -q '.assets[0].apiUrl')
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for VPS SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          echo "Checking SSH reachability on ${VPS_HOST}:${PORT}..."
          for attempt in $(seq 1 90); do
            if nc -z -w 5 "$VPS_HOST" "$PORT" 2>/dev/null; then
              echo "VPS SSH is reachable (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt/90: VPS not reachable yet (waiting 10s for reboot/network)..."
            sleep 10
          done
          echo "VPS did not respond on SSH within 15 minutes. Reboot the VPS in Hostinger hPanel and re-run this workflow."
          exit 1

      - name: Extract and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_BASE64 }}
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_URL: ${{ steps.release_artifact.outputs.asset_url }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 25m
          envs: PROD_ENV_B64,META_TOKEN,META_ACCOUNT,GH_TOKEN,ASSET_URL
          script: |
            set -e
            APP_DIR="/home/deployer/apps/satmi-ads"
            echo "Downloading release.tar.gz from GitHub release asset..."
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" \
              -o "$APP_DIR/release.tar.gz"
            ls -lh "$APP_DIR/release.tar.gz"
            tar -xzf "$APP_DIR/release.tar.gz" -C "$APP_DIR" deploy.sh ecosystem.config.cjs
            chmod +x "$APP_DIR/deploy.sh"
            ENV_FILE="$APP_DIR/.env"
            touch "$ENV_FILE"

            # Merge PROD_ENV_B64 without removing any existing keys in .env, and ensure VPS Supabase + Meta credentials are set
            node -e '
            const fs = require("fs");
            const envPath = "'"$ENV_FILE"'";
            let content = fs.existsSync(envPath) ? fs.readFileSync(envPath, "utf8") : "";
            const b64 = process.env.PROD_ENV_B64 || "";
            if (b64) {
              const decoded = Buffer.from(b64, "base64").toString("utf8");
              for (const line of decoded.split(/\r?\n/)) {
                const m = line.match(/^([A-Z0-9_]+)=(.*)$/);
                if (!m) continue;
                const [, k, v] = m;
                const regex = new RegExp(`^${k}=.*$`, "m");
                if (!regex.test(content)) {
                  content = (content.endsWith("\n") || content.length === 0 ? content : content + "\n") + `${k}=${v}\n`;
                }
              }
            }
            const updates = {
              NEXT_PUBLIC_SUPABASE_URL: "\"https://ads.satmi.in\"",
              SUPABASE_INTERNAL_URL: "\"http://127.0.0.1:8000\"",
              NEXT_PUBLIC_SUPABASE_ANON_KEY: "\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4MzU4NTI5MSwiZXhwIjoyMDk5MTYxMjkxfQ.PNmYQFpq0Yu7QwCq08JAivVQ9WCS3rWzT09CwPs8xZg\"",
              SUPABASE_SERVICE_ROLE_KEY: "\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkZmxvdy12cHMiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzgzNTg1MjkxLCJleHAiOjIwOTkxNjEyOTF9.kcaaZgkR7f_65dSnvynjZ22cqdU451Q934r0JwvnU-8\"",
              NEXT_PUBLIC_APP_URL: "\"https://ads.satmi.in\"",
              REDIRECT_URI: "\"https://ads.satmi.in/auth/callback\"",
              META_ACCESS_TOKEN: process.env.META_TOKEN || "",
              META_AD_ACCOUNT_ID: process.env.META_ACCOUNT || "",
              SMTP_HOST: "\"smtp.gmail.com\"",
              SMTP_PORT: "\"587\"",
              SMTP_USER: "\"support@satmi.in\"",
              SMTP_PASS: "\"psucejbasbscslux\"",
              SMTP_SENDER_NAME: "\"AdFlow\""
            };
            for (const [key, val] of Object.entries(updates)) {
              if (!val) continue;
              const regex = new RegExp(`^${key}=.*$`, "m");
              if (regex.test(content)) {
                content = content.replace(regex, `${key}=${val}`);
              } else {
                content = (content.endsWith("\n") || content.length === 0 ? content : content + "\n") + `${key}=${val}\n`;
              }
            }
            fs.writeFileSync(envPath, content, "utf8");
            const keys = content.split(/\r?\n/).map(l => l.match(/^([A-Z0-9_]+)=(.+)$/)).filter(Boolean).map(m => m[1]);
            console.log("Verified .env keys on VPS (" + keys.length + "):", keys.join(", "));
            '

            # Right-size kernel TCP memory (tcp_mem is in 4KB pages: 32768/49152/65536 = 128MB/192MB/256MB)
            # Yesterday's 262144 pages (1GB unswappable kernel memory) + 16MB socket buffers starved 4GB RAM and caused kswapd 522 livelocks.
            printf "net.ipv4.tcp_mem = 32768 49152 65536\nnet.ipv4.tcp_rmem = 4096 87380 4194304\nnet.ipv4.tcp_wmem = 4096 65536 4194304\nnet.ipv4.tcp_fin_timeout = 15\nnet.ipv4.tcp_tw_reuse = 1\nnet.core.somaxconn = 2048\nvm.swappiness = 10\nvm.vfs_cache_pressure = 100\n" | sudo tee /etc/sysctl.d/99-adflow-network.conf >/dev/null || true
            sudo sysctl -p /etc/sysctl.d/99-adflow-network.conf >/dev/null 2>&1 || true

            # Safely clear stale swap pages if plenty of physical RAM is free
            MEM_AVAIL=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo 2>/dev/null || echo 0)
            SWAP_USED=$(free -m | awk '/^Swap:/ {print $3}' 2>/dev/null || echo 0)
            if [ "$SWAP_USED" -gt 500 ] && [ "$MEM_AVAIL" -gt $((SWAP_USED + 600)) ]; then
              echo "Flushing $SWAP_USED MB of stale swap into $MEM_AVAIL MB available RAM..."
              sudo swapoff -a && sudo swapon -a || true
            fi

            if [ -f /etc/adflow-supabase/postgrest.conf ]; then
              PGRST_BEFORE="$(sudo sha256sum /etc/adflow-supabase/postgrest.conf | awk '{print $1}')"
              sudo sed -i 's/^db-max-rows = .*/db-max-rows = 50000/g' /etc/adflow-supabase/postgrest.conf || true
              sudo sed -i 's/^db-pool = .*/db-pool = 10/g' /etc/adflow-supabase/postgrest.conf || true
              PGRST_AFTER="$(sudo sha256sum /etc/adflow-supabase/postgrest.conf | awk '{print $1}')"
              if [ "$PGRST_BEFORE" != "$PGRST_AFTER" ]; then
                sudo systemctl restart adflow-postgrest || true
              fi
            fi

            if [ -f /etc/adflow-supabase/gotrue.env ]; then
              GOTRUE_BEFORE="$(sudo sha256sum /etc/adflow-supabase/gotrue.env | awk '{print $1}')"
              sudo sed -i 's/^GOTRUE_SMTP_HOST=.*/GOTRUE_SMTP_HOST=smtp.gmail.com/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_SMTP_HOST=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_SMTP_HOST=smtp.gmail.com' | sudo tee -a /etc/adflow-supabase/gotrue.env
              sudo sed -i 's/^GOTRUE_SMTP_PORT=.*/GOTRUE_SMTP_PORT=587/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_SMTP_PORT=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_SMTP_PORT=587' | sudo tee -a /etc/adflow-supabase/gotrue.env
              sudo sed -i 's/^GOTRUE_SMTP_USER=.*/GOTRUE_SMTP_USER=support@satmi.in/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_SMTP_USER=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_SMTP_USER=support@satmi.in' | sudo tee -a /etc/adflow-supabase/gotrue.env
              sudo sed -i 's/^GOTRUE_SMTP_PASS=.*/GOTRUE_SMTP_PASS=psucejbasbscslux/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_SMTP_PASS=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_SMTP_PASS=psucejbasbscslux' | sudo tee -a /etc/adflow-supabase/gotrue.env
              sudo sed -i 's/^GOTRUE_SMTP_ADMIN_EMAIL=.*/GOTRUE_SMTP_ADMIN_EMAIL=support@satmi.in/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_SMTP_ADMIN_EMAIL=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_SMTP_ADMIN_EMAIL=support@satmi.in' | sudo tee -a /etc/adflow-supabase/gotrue.env
              sudo sed -i 's/^GOTRUE_SMTP_SENDER_NAME=.*/GOTRUE_SMTP_SENDER_NAME=AdFlow/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_SMTP_SENDER_NAME=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_SMTP_SENDER_NAME=AdFlow' | sudo tee -a /etc/adflow-supabase/gotrue.env
              sudo sed -i 's/^GOTRUE_MAILER_AUTOCONFIRM=.*/GOTRUE_MAILER_AUTOCONFIRM=false/' /etc/adflow-supabase/gotrue.env || true
              sudo grep -q '^GOTRUE_MAILER_AUTOCONFIRM=' /etc/adflow-supabase/gotrue.env || echo 'GOTRUE_MAILER_AUTOCONFIRM=false' | sudo tee -a /etc/adflow-supabase/gotrue.env
              GOTRUE_AFTER="$(sudo sha256sum /etc/adflow-supabase/gotrue.env | awk '{print $1}')"
              if [ "$GOTRUE_BEFORE" != "$GOTRUE_AFTER" ]; then
                sudo systemctl restart adflow-auth || true
              fi
            fi

            if ! grep -q "127.0.0.1 ads.satmi.in" /etc/hosts 2>/dev/null; then
              echo "127.0.0.1 ads.satmi.in" | sudo tee -a /etc/hosts >/dev/null || true
            fi

            sudo mkdir -p /var/lib/nginx/body /var/lib/nginx/proxy /var/lib/nginx/fastcgi 2>/dev/null || true
            sudo chown -R www-data:www-data /var/lib/nginx 2>/dev/null || true
            sudo rm -f /var/log/*.gz /var/log/nginx/*.gz /var/log/*.1 /var/log/nginx/*.1 2>/dev/null || true
            find /home/deployer/static-cache -type f -mtime +2 -delete 2>/dev/null || true

            if [ -d /etc/nginx/conf.d ]; then
              sudo sed -i 's/# *gzip_types/gzip_types/' /etc/nginx/nginx.conf 2>/dev/null || true
              # Keep Nginx proxy buffering enabled globally so fast local upstreams (PostgREST, Next.js, orders)
              # hand off responses immediately without holding sockets/DB pool slots; streaming media uses X-Accel-Buffering: no.
              printf "client_header_buffer_size 16k;\nlarge_client_header_buffers 8 64k;\nproxy_read_timeout 120s;\nproxy_send_timeout 120s;\n" | sudo tee /etc/nginx/conf.d/adflow-buffers.conf >/dev/null || true
              sudo nginx -t && sudo systemctl reload nginx || sudo rm -f /etc/nginx/conf.d/adflow-buffers.conf
            fi

            bash /home/deployer/apps/satmi-ads/deploy.sh

            if [ -f /home/deployer/apps/satmi-ads/supabase/migrations/20261029120000_fix_creator_changes_and_collaborator_rls.sql ]; then
              sudo -u postgres psql -p 5433 -d postgres -v ON_ERROR_STOP=1 < /home/deployer/apps/satmi-ads/supabase/migrations/20261029120000_fix_creator_changes_and_collaborator_rls.sql
              sudo -u postgres psql -p 5433 -d postgres -c "NOTIFY pgrst, 'reload schema';" || true
            fi

            echo "=== Post-deploy VPS memory & PM2 status ==="
            free -m || true
            pm2 list || true

      - name: Cleanup temporary deploy release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete deploy-artifact --yes --cleanup-tag 2>/dev/null || true


