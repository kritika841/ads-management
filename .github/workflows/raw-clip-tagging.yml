name: Raw clip tagging watchdog

on:
  schedule:
    # The VPS is the primary scheduler and runs every 10 minutes. This is a
    # once-daily recovery check at 00:45 IST, not a second continuous worker.
    - cron: "15 19 * * *"
  workflow_dispatch:

concurrency:
  group: raw-clip-tagging-production
  cancel-in-progress: false

jobs:
  trigger-production-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger locked tagging and embedding pipeline
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 58m
          script: |
            set +e
            /bin/bash /home/deployer/apps/satmi-ads/scripts/run-ingest-cron.sh >> /home/deployer/logs/ingest-clip-segments.log 2>&1
            status=$?
            if [ "$status" -eq 73 ]; then
              echo "Another scheduler already owns the ingest lock; nothing to do."
              exit 0
            fi
            exit "$status"
