name: Update VPS Meta Credentials

on:
  workflow_dispatch:

jobs:
  update-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Update full production .env and restart PM2 on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV_B64: ${{ secrets.PROD_ENV_BASE64 }}
          META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: PROD_ENV_B64,META_TOKEN,META_ACCOUNT
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="/home/deployer/apps/satmi-ads"
            ENV_FILE="$APP_DIR/.env"
            cd "$APP_DIR"

            echo "==> Ensuring full production .env file on VPS..."
            if [ -n "$PROD_ENV_B64" ]; then
              echo "$PROD_ENV_B64" | base64 -d > "$ENV_FILE"
              echo "Decoded and wrote full production .env"
            else
              echo "PROD_ENV_B64 not set, falling back to updating individual Meta credentials..."
              touch "$ENV_FILE"
            fi

            # Double check that Meta credentials are also ensured
            node -e '
            const fs = require("fs");
            const envPath = "'"$ENV_FILE"'";
            let content = fs.existsSync(envPath) ? fs.readFileSync(envPath, "utf8") : "";
            const updates = {
              META_ACCESS_TOKEN: process.env.META_TOKEN || "",
              META_AD_ACCOUNT_ID: process.env.META_ACCOUNT || ""
            };
            for (const [key, val] of Object.entries(updates)) {
              if (!val) continue;
              const regex = new RegExp(`^${key}=.*$`, "m");
              if (regex.test(content)) {
                content = content.replace(regex, `${key}=${val}`);
              } else {
                content = (content.endsWith("\n") || content.length === 0 ? content : content + "\n") + `${key}=${val}\n`;
              }
            }
            fs.writeFileSync(envPath, content, "utf8");
            console.log("Verified .env has Meta keys. Total lines:", content.split("\n").filter(Boolean).length);
            '

            echo "==> Reloading PM2 processes with complete environment..."
            pm2 restart satmi-ads --update-env
            pm2 restart satmi-ads-cron --update-env || true
            pm2 save

            echo "==> Waiting 6 seconds for application to warm up..."
            sleep 6

            echo "==> Verifying application health endpoint..."
            curl -f -s http://localhost:3000/api/health && echo " Health check passed!"

            echo "==> Verifying Supabase connection from VPS..."
            node -e '
            require("dotenv").config({ path: "'"$ENV_FILE"'" });
            const { createClient } = require("@supabase/supabase-js");
            const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
            if (!url || !key) {
              console.error("Missing Supabase credentials in .env");
              process.exit(1);
            }
            const client = createClient(url, key);
            client.from("meta_sync_runs").select("id,created_at").limit(1).then(({ data, error }) => {
              if (error) {
                console.error("Supabase query error:", error.message);
                process.exit(1);
              }
              console.log("Supabase connection verified successfully! Latest sync runs count:", (data || []).length);
            });
            '

            echo "==> Verifying Meta API access directly from VPS..."
            node -e '
            require("dotenv").config({ path: "'"$ENV_FILE"'" });
            const token = process.env.META_ACCESS_TOKEN;
            const accountId = (process.env.META_AD_ACCOUNT_ID || "").replace(/^act_/, "");
            if (!token || !accountId) {
              console.error("Missing META_ACCESS_TOKEN or META_AD_ACCOUNT_ID in environment");
              process.exit(1);
            }
            fetch(`https://graph.facebook.com/v23.0/act_${accountId}?fields=id,name,account_status&access_token=${token}`)
              .then(r => r.json())
              .then(data => {
                if (data.error) {
                  console.error("Meta Graph API error:", data.error.message);
                  process.exit(1);
                }
                console.log("Meta Graph API connected successfully to account:", data.name, "(" + data.id + ")");
              })
              .catch(err => {
                console.error("Network or fetch error:", err);
                process.exit(1);
              });
            '

            echo "==> Triggering Meta data sync with CRON_SECRET..."
            node -e '
            require("dotenv").config({ path: "'"$ENV_FILE"'" });
            const cronSecret = process.env.CRON_SECRET;
            if (!cronSecret) {
              console.log("No CRON_SECRET found in .env, skipping cron sync trigger");
              process.exit(0);
            }
            console.log("Invoking /api/incentives/sync with CRON_SECRET...");
            fetch("http://localhost:3000/api/incentives/sync", {
              headers: { Authorization: `Bearer ${cronSecret}` }
            })
            .then(async r => {
              const text = await r.text();
              console.log(`Status: ${r.status}`);
              console.log(`Response: ${text.slice(0, 500)}`);
              if (!r.ok) process.exit(1);
            })
            .catch(err => {
              console.error("Sync fetch error:", err);
              process.exit(1);
            });
            '

            echo "==> Everything updated and verified successfully!"
